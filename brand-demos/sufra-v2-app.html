<style>
/* Hallmark · macrostructure: app shell (guest column · staff pass · owner sidebar) · tone: utilitarian-luxury · anchor hue: indigo 270
 * design-system: sufra-v2/tokens.css · nav: N3 side-rail (owner) · footer: none (app)
 * pre-emit critique: P5 H4 E4 S5 R4 V4 · contrast: pass (40–41) · honest: sample data labelled (46) · chrome: no fake device frames (47) · tokens: pass (48)
 */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { overflow-x: clip; }
body { background: var(--bg); color: var(--text); font: 400 var(--text-body)/var(--lh-body) var(--font-ui); text-wrap: pretty; -webkit-font-smoothing: antialiased; }
[lang="ar"] body { line-height: var(--lh-body-ar); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; }
button:disabled { cursor: not-allowed; }
img { display: block; max-width: 100%; }
ul, ol { list-style: none; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.tnum { font-variant-numeric: tabular-nums; }
.disp { font-family: var(--font-display); font-weight: 600; }
.ic { width: 18px; height: 18px; flex: none; }
.ic-s { width: 16px; height: 16px; flex: none; }
[dir="rtl"] .flip { transform: scaleX(-1); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--text-2); }
.small { font-size: var(--text-small); }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); height: var(--control-h); padding-inline: var(--space-5); border-radius: var(--radius-md); background: var(--primary); color: var(--on-primary); font-weight: 600; white-space: nowrap; transition: opacity var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease); }
.btn:hover { opacity: .92; }
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .5; transform: none; }
.btn-2 { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); height: var(--control-h); padding-inline: var(--space-4); border-radius: var(--radius-md); border: 1px solid var(--line); background: var(--surface); font-weight: 500; white-space: nowrap; transition: background-color var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease); }
.btn-2:hover { background: var(--surface-2); }
.btn-2:active { transform: scale(.98); }
.btn-2:disabled { opacity: .55; transform: none; background: var(--surface); }
.sm { height: var(--control-h-sm); padding-inline: var(--space-4); font-size: 14px; }
.xs { height: 32px; padding-inline: var(--space-3); font-size: var(--text-small); border-radius: var(--radius-sm); }
.link { color: var(--text-2); text-decoration: underline; text-underline-offset: 3px; font-size: var(--text-small); }
.link:hover { color: var(--text); }
.icon-btn { width: 40px; height: 40px; border-radius: var(--radius-md); display: inline-grid; place-items: center; color: var(--text-2); transition: background-color var(--dur-fast) var(--ease); }
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.icon-btn:active { background: var(--line); }
.seg { display: inline-flex; background: var(--surface-2); border-radius: var(--radius-sm); padding: 2px; }
.seg button { height: 32px; padding-inline: var(--space-3); border-radius: 6px; font-size: var(--text-small); font-weight: 500; color: var(--text-2); white-space: nowrap; transition: background-color var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease); }
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 0 0 1px var(--line); }
.switch { display: inline-flex; align-items: center; gap: var(--space-3); font-size: 14px; color: var(--text-2); }
.switch i { width: 40px; height: 24px; border-radius: 99px; background: var(--line); position: relative; flex: none; transition: background-color var(--dur-base) var(--ease); }
.switch i::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px var(--scrim); transition: transform var(--dur-base) var(--ease); }
.switch[aria-checked="true"] i { background: var(--primary); }
.switch[aria-checked="true"] i::after { transform: translateX(16px); background: var(--on-primary); }
[dir="rtl"] .switch[aria-checked="true"] i::after { transform: translateX(-16px); }
.switch:disabled { opacity: .55; }
.field { display: grid; gap: var(--space-2); }
.field > span { font-size: 14px; font-weight: 500; }
.field small { font-size: var(--text-small); color: var(--text-2); min-height: 1lh; }
.field small.err { color: var(--st-danger); }
.inp { width: 100%; height: var(--control-h); border-radius: var(--radius-md); border: 1px solid var(--line); background: var(--surface); padding-inline: var(--space-4); outline: 2px solid transparent; transition: border-color var(--dur-fast) var(--ease); }
.inp:hover { border-color: var(--text-3); }
.inp:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.inp[aria-invalid="true"] { border-color: var(--st-danger); }
textarea.inp { height: 88px; padding-block: var(--space-3); resize: vertical; }
select.inp { appearance: none; background-image: none; }
.owner .inp, .owner .btn, .owner .btn-2 { height: var(--control-h-sm); }
.owner .btn, .owner .btn-2 { font-size: 14px; }
.stepper { display: inline-flex; align-items: center; height: 40px; border-radius: var(--radius-md); border: 1px solid var(--line); background: var(--surface); }
.stepper button { width: 40px; height: 38px; display: grid; place-items: center; color: var(--text); border-radius: var(--radius-md); transition: background-color var(--dur-fast) var(--ease); }
.stepper button:hover { background: var(--surface-2); }
.stepper button:disabled { color: var(--text-3); background: none; }
.stepper b { min-width: 28px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
.stepper.on { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.stepper.on button { color: var(--on-primary); }
.stepper.on button:hover { background: var(--brand-field); }
.st { display: inline-flex; align-items: center; gap: var(--space-2); white-space: nowrap; }
.st::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--c); flex: none; }
.arch { border-radius: var(--radius-arch); overflow: hidden; background: var(--surface-2); flex: none; }
.arch img { width: 100%; height: 100%; object-fit: cover; }

/* ---------- prototype top bar (hidden in embed) ---------- */
.top { scrollbar-width: none; position: sticky; top: 0; z-index: 30; height: 56px; display: flex; align-items: center; gap: var(--space-4); padding-inline: var(--space-5); background: var(--surface); border-block-end: 1px solid var(--line); }
.top .id { display: flex; align-items: center; gap: var(--space-2); font-weight: 600; margin-inline-end: auto; white-space: nowrap; }
.top .id svg { width: 22px; height: 22px; }
.top .id small { font-weight: 400; color: var(--text-3); font-size: var(--text-small); }
[data-embed] .top { display: none; }
#app { height: calc(100dvh - 57px); }
[data-embed] #app { height: 100dvh; }

/* ---------- layouts ---------- */
.v-guest { display: grid; justify-items: center; height: 100%; background: var(--surface-2); }
.v-split { display: grid; grid-template-columns: 420px minmax(0, 1fr); height: 100%; }
.v-split .gcol { border-inline-end: 1px solid var(--line); }
.gcol { width: min(420px, 100%); height: 100%; overflow-y: auto; position: relative; background: var(--bg); display: flex; flex-direction: column; }
.v-guest .gcol { border-inline: 1px solid var(--line); }

/* ---------- guest ---------- */
.welcome { background: var(--brand); color: var(--on-brand); flex: 1; display: flex; flex-direction: column; align-items: center; text-align: center; padding: var(--space-10) var(--space-6) var(--space-6); min-height: 100%; }
.welcome .frame { width: 248px; height: 304px; }
.welcome .tline { width: 296px; height: 2px; border-radius: 2px; background: var(--brand-rule); }
.welcome h1 { font: 600 var(--text-display)/var(--lh-display) var(--font-display); margin-block-start: var(--space-6); overflow-wrap: anywhere; }
.welcome .tbl { margin-block-start: var(--space-2); color: var(--on-brand); opacity: .85; }
.welcome form { width: 100%; margin-block-start: auto; padding-block-start: var(--space-8); display: grid; gap: var(--space-3); text-align: start; }
.welcome .field > span { color: var(--on-brand); }
.welcome .field small { color: var(--on-brand); opacity: .85; }
.welcome .field small.err { color: var(--on-brand); opacity: 1; font-weight: 500; }
.welcome .inp { background: var(--brand-field); border-color: var(--brand-rule); color: var(--on-brand); }
.welcome .inp::placeholder { color: var(--on-brand); opacity: .6; }
.welcome .inp:focus-visible { outline-color: var(--on-brand); }
.welcome .btn { background: var(--on-brand); color: var(--brand); width: 100%; }
.welcome .note { background: var(--brand-field); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); font-size: 14px; text-align: start; }
.welcome .by { display: flex; align-items: center; justify-content: center; gap: var(--space-2); font-size: var(--text-small); opacity: .85; margin-block-start: var(--space-4); }
.welcome .by svg { width: 16px; height: 16px; }

.g-head { position: sticky; top: 0; z-index: 3; background: var(--bg); }
.g-bar { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-4) var(--space-5) var(--space-2); }
.g-bar .v { font: 600 22px/1.15 var(--font-display); margin-inline-end: auto; overflow-wrap: anywhere; min-width: 0; }
.g-bar .t { font-size: var(--text-small); color: var(--text-2); white-space: nowrap; }
.g-tabs { display: flex; gap: var(--space-5); padding-inline: var(--space-5); border-block-end: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.g-tabs button { padding-block: var(--space-2) var(--space-3); color: var(--text-2); white-space: nowrap; font-size: var(--text-body); transition: color var(--dur-fast) var(--ease); }
.g-tabs button:hover { color: var(--text); }
.g-tabs button[aria-selected="true"] { color: var(--text); font-weight: 500; box-shadow: inset 0 -2px 0 var(--text); }
.paused { margin: var(--space-3) var(--space-5) 0; padding: var(--space-3) var(--space-4); border-radius: var(--radius-md); background: var(--surface-2); font-size: 14px; color: var(--text); }
.g-body { padding: var(--space-4) var(--space-5) var(--space-6); flex: 1; }
.feat { position: relative; display: block; width: 100%; text-align: start; border-radius: var(--radius-lg); overflow: hidden; height: 200px; margin-block-end: var(--space-2); }
.feat img { width: 100%; height: 100%; object-fit: cover; transition: transform var(--dur-slow) var(--ease); }
@media (hover: hover) and (pointer: fine) { .feat:hover img { transform: scale(1.02); } }
.feat .cap { position: absolute; inset-inline: 0; bottom: 0; padding: var(--space-10) var(--space-4) var(--space-4); background: linear-gradient(to top, var(--photo-scrim), transparent); color: var(--on-photo); display: flex; justify-content: space-between; align-items: end; gap: var(--space-3); }
.feat .cap b { font: 600 22px/1.15 var(--font-display); }
.feat .cap span { font-weight: 500; white-space: nowrap; }
.dish { display: grid; grid-template-columns: minmax(0, 1fr) 80px; gap: var(--space-4); padding-block: var(--space-4); border-block-end: 1px solid var(--line); }
.dish:last-child { border: 0; }
.dish.noimg { grid-template-columns: minmax(0, 1fr); }
.dish .open { text-align: start; display: grid; gap: var(--space-1); }
.dish .n { font: 600 19px/1.2 var(--font-display); }
.dish .d { font-size: 14px; color: var(--text-2); line-height: 1.45; }
.dish .row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); margin-block-start: var(--space-3); }
.dish .p { font-weight: 500; font-variant-numeric: tabular-nums; }
.dish .arch { width: 80px; height: 96px; }
.dish.out .n, .dish.out .p { color: var(--text-3); }
.dish.out .arch img { filter: grayscale(1); opacity: .6; }
.soldout { font-size: var(--text-small); color: var(--text-2); }
.g-foot { position: sticky; bottom: 0; padding: var(--space-3) var(--space-4) var(--space-4); background: linear-gradient(to top, var(--bg) 70%, transparent); }
.g-foot .btn { width: 100%; justify-content: space-between; height: 56px; padding-inline: var(--space-5); }

.track { padding: var(--space-6) var(--space-6) var(--space-6); display: flex; flex-direction: column; flex: 1; gap: var(--space-2); }
.track h2 { font: 600 var(--text-title-1)/var(--lh-title) var(--font-display); }
.steps { display: grid; margin-block: var(--space-6) var(--space-4); }
.step { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 0 var(--space-3); position: relative; padding-block-end: var(--space-5); }
.step:last-child { padding-block-end: 0; }
.step::before { content: ""; position: absolute; inset-inline-start: 9px; top: 20px; bottom: 0; width: 2px; background: var(--line); }
.step:last-child::before { display: none; }
.step.done::before { background: var(--text); }
.step i { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); background: var(--bg); position: relative; z-index: 1; display: grid; place-items: center; }
.step.done i { background: var(--text); border-color: var(--text); color: var(--bg); }
.step.now i { border-color: var(--accent); }
.step.now i::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.step i svg { width: 12px; height: 12px; }
.step b { font-weight: 500; }
.step small { display: block; font-size: var(--text-small); color: var(--text-2); }
.step time { font-size: var(--text-small); color: var(--text-3); font-variant-numeric: tabular-nums; }
.step.wait b { color: var(--text-3); font-weight: 400; }
.ord { border-block-start: 1px solid var(--line); padding-block: var(--space-4); }
.ord h3 { font-size: 14px; font-weight: 500; color: var(--text-2); margin-block-end: var(--space-3); display: flex; justify-content: space-between; gap: var(--space-2); }
.lines { display: grid; gap: var(--space-3); }
.lines li { display: flex; align-items: center; gap: var(--space-3); font-size: 15px; }
.lines .arch { width: 32px; height: 38px; }
.lines .ph { width: 32px; height: 38px; border-radius: var(--radius-arch); background: var(--surface-2); flex: none; }
.lines .nm { min-width: 0; }
.lines .nm small { display: block; font-size: var(--text-small); color: var(--text-2); }
.lines .amt { margin-inline-start: auto; font-variant-numeric: tabular-nums; color: var(--text-2); white-space: nowrap; }
.tot { display: flex; justify-content: space-between; padding-block: var(--space-4); border-block-start: 1px solid var(--line); font-weight: 600; }
.acts2 { margin-block-start: auto; display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); padding-block-start: var(--space-4); }
.acts2 .btn-2 { padding-inline: var(--space-2); }
.acts2 .wide { grid-column: 1 / -1; }
.bill-note { background: var(--surface-2); border-radius: var(--radius-md); padding: var(--space-4); font-size: 15px; }

/* sheets (guest) + drawer (owner) + dialog (staff) */
.scrim { position: absolute; inset: 0; background: var(--scrim); z-index: 10; animation: fade var(--dur-base) var(--ease); }
.sheet { position: absolute; inset-inline: 0; bottom: 0; z-index: 11; max-height: 92%; overflow-y: auto; background: var(--bg); border-radius: var(--radius-xl) var(--radius-xl) 0 0; padding: var(--space-3) var(--space-5) var(--space-5); animation: rise var(--dur-slow) var(--ease); box-shadow: var(--shadow-float); }
.sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto var(--space-3); }
.sheet .x { position: absolute; top: var(--space-3); inset-inline-end: var(--space-3); }
.sheet .hero { display: flex; justify-content: center; margin-block: var(--space-2) var(--space-5); }
.sheet .hero .arch { width: 184px; height: 224px; }
.sheet h2 { font: 600 28px/1.15 var(--font-display); }
.sheet .d { color: var(--text-2); margin-block: var(--space-2) var(--space-5); }
.opts { display: grid; gap: var(--space-2); margin-block-end: var(--space-5); }
.opts legend { font-weight: 500; margin-block-end: var(--space-2); font-size: 15px; }
.opts fieldset { border: 0; display: grid; gap: var(--space-2); }
.opt { display: flex; align-items: center; gap: var(--space-3); min-height: var(--control-h); padding-inline: var(--space-4); border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface); cursor: pointer; transition: border-color var(--dur-fast) var(--ease); }
.opt:hover { border-color: var(--text-3); }
.opt:has(input:checked) { border-color: var(--text); box-shadow: inset 0 0 0 1px var(--text); }
.opt input { accent-color: var(--primary); width: 18px; height: 18px; }
.opt span:last-child { margin-inline-start: auto; color: var(--text-2); font-variant-numeric: tabular-nums; }
.sheet-foot { display: flex; gap: var(--space-3); align-items: center; margin-block-start: var(--space-5); }
.sheet-foot .btn { flex: 1; justify-content: space-between; }
.cart-line { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-2) var(--space-3); padding-block: var(--space-4); border-block-end: 1px solid var(--line); align-items: center; }
.cart-line .nm b { font: 600 18px/1.2 var(--font-display); display: block; }
.cart-line .nm small { color: var(--text-2); font-size: var(--text-small); }
.cart-line .amt { font-variant-numeric: tabular-nums; font-weight: 500; text-align: end; }
@keyframes rise { from { transform: translateY(24px); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }

/* ---------- staff ---------- */
.v-staff { display: flex; flex-direction: column; height: 100%; min-width: 0; background: var(--bg); }
.s-top { display: flex; align-items: center; gap: var(--space-6); height: 60px; padding-inline: var(--space-5); background: var(--surface); border-block-end: 1px solid var(--line); flex: none; }
.s-top .vn { display: flex; align-items: center; gap: var(--space-2); font-weight: 600; white-space: nowrap; }
.s-top .vn svg { width: 22px; height: 22px; }
.s-tabs { display: flex; height: 100%; }
.s-tabs button { display: flex; align-items: center; gap: var(--space-2); padding-inline: var(--space-4); color: var(--text-2); font-weight: 500; white-space: nowrap; transition: color var(--dur-fast) var(--ease); }
.s-tabs button:hover { color: var(--text); }
.s-tabs button[aria-selected="true"] { color: var(--text); box-shadow: inset 0 -2px 0 var(--text); }
.s-tabs b { font-weight: 500; font-size: var(--text-small); color: var(--text-3); font-variant-numeric: tabular-nums; }
.s-top .rt { margin-inline-start: auto; display: flex; align-items: center; gap: var(--space-5); }
.live { display: inline-flex; align-items: center; gap: var(--space-2); font-size: 14px; color: var(--text-2); white-space: nowrap; }
.live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--st-ready); }
.s-banner { padding: var(--space-3) var(--space-5); background: var(--surface-2); border-block-end: 1px solid var(--line); font-size: 14px; flex: none; }
.calls { display: flex; flex-wrap: wrap; gap: var(--space-3); padding: var(--space-3) var(--space-5); border-block-end: 1px solid var(--line); background: var(--surface); flex: none; }
.call { display: flex; align-items: center; gap: var(--space-3); padding-block: var(--space-2); padding-inline: var(--space-4) var(--space-2); border-radius: var(--radius-md); background: var(--bg); border: 1px solid var(--line); font-size: 14px; animation: fade var(--dur-base) var(--ease); }
.call b { font: 600 20px/1 var(--font-display); }
.call time { color: var(--text-3); font-size: var(--text-small); }
.call .btn { height: 36px; padding-inline: var(--space-4); font-size: 14px; border-radius: var(--radius-sm); }
.cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); flex: 1; min-height: 0; }
.col { padding: var(--space-4) var(--space-3) var(--space-6); border-inline-end: 1px solid var(--line); overflow-y: auto; }
.col:last-child { border: 0; }
.col-h { display: flex; justify-content: space-between; align-items: baseline; padding: 0 var(--space-2) var(--space-3); }
.col-h h2 { font-size: 15px; font-weight: 600; }
.col-h span { color: var(--text-3); font-size: 14px; font-variant-numeric: tabular-nums; }
.col .empty { padding: var(--space-6) var(--space-2); color: var(--text-2); font-size: 14px; }
.tk { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: var(--space-4); margin-block-end: var(--space-3); animation: fade var(--dur-base) var(--ease); }

function seed() {

  const line = (id, qty, opt) => { const it = byId(id); const add = it.opts && opt != null ? it.opts.choices[opt].add : 0; return { item: id, qty, opt: opt ?? null, note: "", price: it.price + add }; };
  // deterministic history across the last 9 hours: all served
  let h = 7; const rnd = () => (h = (h * 9301 + 49297) % 233280) / 233280;
  const ids = menu.map(i => i.id).filter(id => id !== "daqqus");
  const orders = [];
  for (let k = 0; k < 30; k++) {
    const ago = 30 + Math.floor(rnd() * 500), n = 1 + Math.floor(rnd() * 3), lines = [];
    for (let j = 0; j < n; j++) lines.push(line(ids[Math.floor(rnd() * ids.length)], 1 + Math.floor(rnd() * 2)));
    const at = now() - ago * MIN, prep = (9 + Math.floor(rnd() * 12)) * MIN;
    orders.push({ id: ++seq, table: 1 + Math.floor(rnd() * 18), guest: NAMES[Math.floor(rnd() * NAMES.length)], lines, status: "served", at, readyAt: at + prep, history: true });
  }
  const live = (table, guest, mins, status, lines, extra = {}) => orders.push({ id: ++seq, table, guest, lines, status, at: now() - mins * MIN, ...extra });
  live(14, "Rashid", 52, "served", [line("lamb-kabsa", 2), line("karak", 2)], { readyAt: now() - 38 * MIN });

/* chime when the shift is on */
let ac;
function chime(kind) {
  if (!S.staff.shift || !ac) return;
  (kind === "order" ? [880, 1175] : [660, 660]).forEach((f, i) => {
    const o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime + i * 0.18;
    o.frequency.value = f; o.connect(g); g.connect(ac.destination);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.2, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.35);
    o.start(t0); o.stop(t0 + 0.4);
  });
}

    ${list.map(o => `<tr><td><span class="tb">${tableL(o.table)}</span></td><td class="opt-col">${esc(guestName(o.guest)) || (o.guests ? `${o.guests} ${t("guests")}` : "—")}</td><td>${statusTag(o)}</td><td class="num opt-col">${o.lines.reduce((a, l) => a + l.qty, 0)}</td><td class="tnum opt-col">${clock(o.at)}</td><td class="num">${money(orderTotal(o))}</td></tr>`).join("")}</tbody></table>`;
}
function ordersP() {
  const f = S.owner.filter, list = [...S.orders].sort((a, b) => b.at - a.at).filter(o => f === "all" || (f === "kitchen" ? ["received", "preparing", "ready"].includes(o.status) : o.status === f));

    <div class="toolbar"><div class="seg" role="group">${[["all", "all"], ["kitchen", "kitchen"], ["served", "servedF"], ["cancelled", "cancelledF"]].map(([k, l]) => `<button aria-pressed="${f === k}" data-act="o-filter" data-id="${k}">${t(l)}</button>`).join("")}</div></div>${orderTable(list)}`;
}
function menuP() {
  return `<div class="om-h"><div><h1>${t("menu")}</h1><p>${S.menu.length} · ${t("sample")}</p></div><div class="acts"><button class="btn" data-act="o-edit" data-id="">${icon("plus")}${t("addItem")}</button></div></div>
    <table><thead><tr><th>${t("dish")}</th><th class="opt-col">${t("category")}</th><th class="num">${t("price")}</th><th>${t("available")}</th><th class="num"><span class="sr">${t("edit")}</span></th></tr></thead><tbody>
    ${S.menu.map(i => `<tr><td><span style="display:flex;align-items:center;gap:var(--space-3)">${arch(i.img, 36, 44)}<span><b style="font-weight:500">${esc(i.name.en)}</b><br><span class="muted small" lang="ar">${esc(i.name.ar)}</span></span></span></td><td class="opt-col">${L(CATS.find(c => c.id === i.cat))}</td><td class="num">${money(i.price)}</td>
      <td><button class="switch" role="switch" aria-checked="${i.available}" data-act="s-avail" data-id="${i.id}" aria-label="${t("available")} ${esc(L(i.name))}"><i></i></button></td>
      <td class="num"><button class="btn-2 xs" data-act="o-edit" data-id="${i.id}">${icon("edit", "ic-s")}${t("edit")}</button></td></tr>`).join("")}</tbody></table>`;
}
function drawer() {
  const d = S.owner.draft, e = S.owner.errs;
  const f = (k, label, dir = "") => `<label class="field"><span>${t(label)}</span><input class="inp" ${dir} data-input="o-draft" data-k="${k}" value="${esc(d[k])}" aria-invalid="${!!e[k]}"><small class="${e[k] ? "err" : ""}">${e[k] ? t(e[k]) : ""}</small></label>`;
  return `<div class="scrim" data-act="o-close"></div><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="dr-h">
    <div class="dh"><h2 id="dr-h">${t(S.owner.drawer === "new" ? "newDish" : "editDish")}</h2><button class="icon-btn" data-act="o-close" aria-label="${t("close")}">${icon("x")}</button></div>
    <div class="db">${f("en", "nameEn")}${f("ar", "nameAr", 'dir="rtl" lang="ar"')}${f("den", "descEn")}${f("dar", "descAr", 'dir="rtl" lang="ar"')}${f("price", "priceAed", 'inputmode="decimal"')}
      <label class="field"><span>${t("category")}</span><select class="inp" data-input="o-draft" data-k="cat">${CATS.map(c => `<option value="${c.id}" ${d.cat === c.id ? "selected" : ""}>${L(c)}</option>`).join("")}</select><small></small></label></div>
    <div class="df"><button class="btn-2" data-act="o-close">${t("cancel")}</button><button class="btn" data-act="o-save">${t("save")}</button></div></aside>`;
}
function tablesP() {
  return `<div class="om-h"><div><h1>${t("tablesQR")}</h1><p>${t("qrNote")}</p></div><div class="acts"><button class="btn" data-act="o-print">${icon("print")}${t("printCards")}</button></div></div>
    <div class="qgrid">${Array.from({ length: 18 }, (_, i) => i + 1).map(n => `<div class="tent"><span class="no">${n}</span><span class="no-ar" lang="ar">طاولة ${n}</span><span class="q"><svg viewBox="0 0 29 29" shape-rendering="crispEdges" aria-label="QR placeholder"><g data-qr="${S.slugs[n]}"></g></svg></span><span class="cta">${T.scan[0]}</span><span class="cta-ar" lang="ar" dir="rtl">${T.scan[1]}</span>${S.venue.pin ? `<span class="code">${t("codeL")} ${S.codes[n]}</span>` : ""}<span class="ft"><svg aria-hidden="true"><use href="#mark"/></svg>Sufra</span></div>`).join("")}</div>`;
}
function teamP() {
  const o = S.owner;
  return `<div class="om-h"><div><h1>${t("team")}</h1></div></div>
    <ul class="team" style="max-width:640px">${S.team.map(m => `<li><i>${m.name[0]}</i><span class="nm">${m.name}${m.me ? ` (${t("you")})` : ""}<small>${t(m.role === "owner" ? "owner" : "staffR")}</small></span></li>`).join("")}
    ${o.invites.map((v, k) => `<li><i>@</i><span class="nm">${esc(v.email)}<small>${t("pending")}</small></span><button class="link" data-act="o-uninvite" data-k="${k}">${t("cancel")}</button></li>`).join("")}</ul>
    <form data-form="invite" novalidate style="max-width:640px;margin-block-start:var(--space-8)"><h2 style="font-size:var(--text-title-3);font-weight:600">${t("inviteH")}</h2><p class="muted" style="margin-block:var(--space-1) var(--space-4)">${t("inviteNote")}</p>
      <div style="display:flex;gap:var(--space-3);align-items:start"><label class="field" style="flex:1"><span class="sr">${t("email")}</span><input class="inp" type="email" name="email" placeholder="name@venue.ae" value="${esc(o.invite)}" aria-invalid="${o.inviteErr}" aria-describedby="inv-h"><small id="inv-h" class="${o.inviteErr ? "err" : ""}">${o.inviteErr ? t("emailErr") : ""}</small></label><button class="btn" type="submit">${t("invite")}</button></div></form>`;
}
function settingsP() {
  const v = S.venue, saved = now() - S.owner.savedAt < 2500;
  return `<div class="om-h"><div><h1>${t("settings")}</h1></div></div>
    <form data-form="settings" novalidate class="form2">
      <label class="field"><span>${t("nameEn")}</span><input class="inp" name="nen" value="${esc(v.name.en)}" required><small></small></label>
      <label class="field"><span>${t("nameAr")}</span><input class="inp" name="nar" dir="rtl" lang="ar" value="${esc(v.name.ar)}" required><small></small></label>
      <label class="field"><span>${t("tagEn")}</span><input class="inp" name="ten" value="${esc(v.tagline.en)}"><small></small></label>
      <label class="field"><span>${t("tagAr")}</span><input class="inp" name="tar" dir="rtl" lang="ar" value="${esc(v.tagline.ar)}"><small></small></label>
      <label class="field full"><span>${t("service")}</span><select class="inp" name="svc"><option value="table" ${v.service === "table" ? "selected" : ""}>${t("svcTable")}</option><option value="counter" ${v.service === "counter" ? "selected" : ""}>${t("svcCounter")}</option></select><small></small></label>
      <div class="full"><div class="setrow"><div><b>${t("pauseL")}</b><p>${t("pauseD")}</p></div><button type="button" class="switch" role="switch" aria-checked="${v.paused}" data-act="o-pause2" aria-label="${t("pauseL")}"><i></i></button></div>
        <div class="setrow"><div><b>${t("pinL")}</b><p>${t("pinD")}</p></div><button type="button" class="switch" role="switch" aria-checked="${v.pin}" data-act="o-pin" aria-label="${t("pinL")}"><i></i></button></div></div>
      <div class="full"><button class="btn" type="submit">${saved ? icon("check") + t("saved") : t("save")}</button></div>
    </form>`;
}

/* charts */
const ns = "http://www.w3.org/2000/svg";
const el = (n, a, txt) => { const e = document.createElementNS(ns, n); for (const k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; return e; };
function drawChart() {
  const svg = document.getElementById("chart"); if (!svg) return;
  const W = 640, H = 240, Lp = 28, R = 8, Tp = 12, B = 26;
  const hNow = new Date().getHours(), hours = Array.from({ length: 12 }, (_, i) => (hNow - 11 + i + 24) % 24);
  const today = hours.map(h => S.orders.filter(o => o.status !== "cancelled" && new Date(o.at).getHours() === h && now() - o.at < 12 * 60 * MIN).length);
  const max = Math.max(10, ...today, ...LAST_WEEK);
  const x = i => Lp + i * (W - Lp - R) / 11, y = v => Tp + (H - Tp - B) * (1 - v / max);
  [0, Math.round(max / 2), max].forEach(v => { svg.append(el("line", { x1: Lp, x2: W - R, y1: y(v), y2: y(v), stroke: "var(--line)" })); svg.append(el("text", { x: 0, y: y(v) + 4 }, v)); });
  hours.forEach((h, i) => { if (i % 2 === 1) svg.append(el("text", { x: x(i), y: H - 6, "text-anchor": "middle" }, String(h).padStart(2, "0") + ":00")); });
  const path = d => d.map((v, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1)).join(" ");
  svg.append(el("path", { d: path(LAST_WEEK), fill: "none", stroke: "var(--text-3)", "stroke-width": 1.5, "stroke-dasharray": "3 4" }));
  svg.append(el("path", { d: path(today), fill: "none", stroke: "var(--text)", "stroke-width": 2.25, "stroke-linejoin": "round" }));
  svg.append(el("line", { x1: x(11), x2: x(11), y1: Tp, y2: H - B, stroke: "var(--accent)" }));
  svg.append(el("circle", { cx: x(11), cy: y(today[11]), r: 4.5, fill: "var(--accent)", stroke: "var(--surface)", "stroke-width": 2 }));
  svg.append(el("text", { x: x(11) - 8, y: Tp + 10, "text-anchor": "end", style: "fill:var(--text);font-weight:500" }, S.lang === "ar" ? `${today[11]} هذه الساعة` : `${today[11]} this hour`));
}
function drawFloor() {
  const svg = document.getElementById("floor"); if (!svg) return;
  for (let n = 1; n <= 18; n++) {
    const i = n - 1, cx = 25 + (i % 6) * 50, cy = 8 + Math.floor(i / 6) * 76, v = S.visits[n];
    const st = !v ? "free" : v.billAsked && !v.paid ? "bill" : "seat";
    svg.append(el("path", { d: `M${cx - 14} ${cy + 40}V${cy + 14}a14 14 0 0 1 28 0v26z`, fill: st === "bill" ? "var(--accent)" : st === "seat" ? "var(--primary)" : "none", stroke: st === "free" ? "var(--text-3)" : "none", "stroke-width": 1.5 }));
    svg.append(el("line", { x1: cx - 19, x2: cx + 19, y1: cy + 41, y2: cy + 41, stroke: "var(--line)", "stroke-width": 2, "stroke-linecap": "round" }));
    svg.append(el("text", { x: cx, y: cy + 58, "text-anchor": "middle" }, n));
  }
}

/* ---------------- render ---------------- */
const params = new URLSearchParams(location.search);
function render() {
  const root = document.documentElement;
  root.lang = S.lang; root.dir = S.lang === "ar" ? "rtl" : "ltr"; root.dataset.theme = S.theme;
  if (params.has("embed")) root.dataset.embed = "";
  document.querySelectorAll("[data-t]").forEach(e => e.textContent = t(e.dataset.t));
  document.querySelectorAll(".top .seg").forEach(s => s.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(S[s.dataset.set] === b.dataset.v))));
  const app = document.getElementById("app"), sy = [...app.querySelectorAll(".gcol,.om,.col,.s-scroll")].map(e => e.scrollTop);
  app.innerHTML = S.view === "guest" ? `<div class="v-guest">${guestView()}</div>`
    : S.view === "staff" ? staffView()
    : S.view === "owner" ? ownerView()
    : `<div class="v-split">${guestView()}${staffView()}</div>`;
  [...app.querySelectorAll(".gcol,.om,.col,.s-scroll")].forEach((e, i) => { if (sy[i]) e.scrollTop = sy[i]; });
  document.querySelectorAll("[data-qr]").forEach(g => drawQR(g, g.dataset.qr));
  drawChart(); drawFloor();
  const focusSel = app.querySelector(".sheet .x, .dlg .btn-2, .drawer input");
  if (focusSel && pendingFocus) { focusSel.focus({ preventScroll: true }); pendingFocus = false; }
}
let pendingFocus = false;

/* ---------------- actions ---------------- */
function placeOrder() {
  const g = S.guest;
  if (!S.visits[g.table]) S.visits[g.table] = { table: g.table, guests: 2, opened: now() - 1000, billAsked: false, paid: null };
  const o = { id: ++seq, table: g.table, guest: g.name.trim(), lines: g.cart.map(l => ({ ...l })), status: "received", at: now() };
  S.orders.push(o); g.mine.push(o.id); g.cart = []; g.cartOpen = false; g.step = "track"; g.billView = false;
  S.staff.fresh.push(o.id); setTimeout(() => { S.staff.fresh = S.staff.fresh.filter(x => x !== o.id); render(); }, 4000);
  chime("order"); announce(`${t("colNew")}: ${tableL(o.table)}`);
}
function addToCart(id, opt, qty, note) {
  const g = S.guest, i = item(id), add = i.opts ? i.opts.choices[opt].add : 0;
  const ex = g.cart.find(l => l.item === id && l.opt === (i.opts ? opt : null) && l.note === note);
  if (ex) ex.qty += qty; else g.cart.push({ item: id, qty, opt: i.opts ? opt : null, note, price: i.price + add });
}
const A = {
  reset: () => { seed(); },
  "g-cat": d => { S.guest.cat = d.id; },
  "g-open": d => { const g = S.guest; g.sheet = d.id; g.sheetOpt = 0; g.sheetQty = 1; g.sheetNote = ""; pendingFocus = true; },
  "g-close": () => { S.guest.sheet = null; },
  "g-sq": d => { S.guest.sheetQty = Math.max(1, S.guest.sheetQty + +d.d); },
  "g-add": () => { const g = S.guest; addToCart(g.sheet, g.sheetOpt, g.sheetQty, g.sheetNote.trim()); g.sheet = null; },
  "g-quick": d => addToCart(d.id, 0, 1, ""),
  "g-inc": d => addToCart(d.id, 0, 1, ""),
  "g-dec": d => { const g = S.guest, l = g.cart.find(x => x.item === d.id && !x.note); if (l && --l.qty <= 0) g.cart.splice(g.cart.indexOf(l), 1); },
  "g-cart": () => { S.guest.cartOpen = true; pendingFocus = true; },
  "g-cartx": () => { S.guest.cartOpen = false; },
  "g-cq": d => { const c = S.guest.cart, l = c[+d.k]; l.qty = Math.max(0, l.qty + +d.d); if (!l.qty) c.splice(+d.k, 1); },
  "g-send": () => placeOrder(),
  "g-track": () => { S.guest.step = "track"; S.guest.billView = false; },
  "g-more": () => { S.guest.step = "menu"; },
  "g-waiter": () => { S.requests.push({ id: ++seq, table: S.guest.table, kind: "waiter", at: now() }); chime("call"); },
  "g-bill": () => { const v = S.visits[S.guest.table]; if (v && !v.billAsked) { v.billAsked = true; S.requests.push({ id: ++seq, table: S.guest.table, kind: "bill", at: now() }); chime("call"); } S.guest.billView = true; },
  "g-billx": () => { S.guest.billView = false; },
  "s-tab": d => { S.staff.tab = d.id; },
  "s-shift": () => { S.staff.shift = !S.staff.shift; if (S.staff.shift) { ac ??= new AudioContext(); ac.resume(); chime("order"); } },
  "s-adv": d => { const o = S.orders.find(x => x.id === +d.id), nx = { received: "preparing", preparing: "ready", ready: "served" }[o.status]; o.status = nx; if (nx === "preparing") o.prepAt = now(); if (nx === "ready") o.readyAt = now(); if (nx === "served") o.servedAt = now(); },
  "s-cancel": d => { S.staff.cancel = +d.id; pendingFocus = true; },
  "s-cancelx": () => { S.staff.cancel = null; },
  "s-cancelok": () => { const o = S.orders.find(x => x.id === S.staff.cancel); o.status = "cancelled"; o.reasonL = { en: T[S.staff.reason][0], ar: T[S.staff.reason][1] }; S.staff.cancel = null; },
  "s-resolve": d => { const r = S.requests.find(x => x.id === +d.id); S.requests = S.requests.filter(x => x !== r); },
  "s-avail": d => { const i = item(d.id); i.available = !i.available; },
  "s-pay": d => { const v = S.visits[d.id]; v.paid = d.m; S.requests = S.requests.filter(r => !(r.table === v.table && r.kind === "bill")); },
  "s-closet": d => { delete S.visits[d.id]; if (+d.id === S.guest.table) { S.guest.mine = []; S.guest.step = "welcome"; S.guest.billView = false; } },
  "o-page": d => { S.owner.page = d.id; S.owner.drawer = null; },
  "o-pause": () => { S.venue.paused = !S.venue.paused; },
  "o-pause2": () => { S.venue.paused = !S.venue.paused; },
  "o-pin": () => { S.venue.pin = !S.venue.pin; },
  "o-filter": d => { S.owner.filter = d.id; },
  "o-edit": d => { const i = d.id ? item(d.id) : null; S.owner.drawer = d.id || "new"; S.owner.errs = {}; S.owner.draft = i ? { en: i.name.en, ar: i.name.ar, den: i.desc.en, dar: i.desc.ar, price: String(i.price / 100), cat: i.cat } : { en: "", ar: "", den: "", dar: "", price: "", cat: "mains" }; pendingFocus = true; },
  "o-close": () => { S.owner.drawer = null; },
  "o-save": () => {
    const o = S.owner, d = o.draft, errs = {}, p = parseFloat(d.price);
    if (!d.en.trim()) errs.en = "required"; if (!d.ar.trim()) errs.ar = "required"; if (!(p > 0)) errs.price = "priceErr";
    o.errs = errs; if (Object.keys(errs).length) return;
    const data = { name: { en: d.en.trim(), ar: d.ar.trim() }, desc: { en: d.den.trim(), ar: d.dar.trim() }, price: Math.round(p * 100), cat: d.cat };
    if (o.drawer === "new") S.menu.push({ id: "new-" + (++seq), available: true, ...data }); else Object.assign(item(o.drawer), data);
    o.drawer = null;
  },
  "o-uninvite": d => { S.owner.invites.splice(+d.k, 1); },
  "o-print": () => { setTimeout(() => window.print(), 50); return false; },
};
document.addEventListener("click", e => {
  const seg = e.target.closest(".top .seg button");
  if (seg) { S[seg.parentElement.dataset.set] = seg.dataset.v; render(); return; }
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const f = A[b.dataset.act]; if (!f) return;
  e.preventDefault();
  if (f(b.dataset) !== false) render();
});
document.addEventListener("input", e => {
  const x = e.target;
  if (x.dataset.input === "g-note") S.guest.sheetNote = x.value;
  if (x.dataset.input === "o-draft") S.owner.draft[x.dataset.k] = x.value;
  if (x.form?.dataset.form === "join") S.guest[x.name] = x.value;
  if (x.form?.dataset.form === "invite") S.owner.invite = x.value;
});
document.addEventListener("change", e => {
  const x = e.target;
  if (x.dataset.change === "g-opt") { S.guest.sheetOpt = +x.value; render(); }
  if (x.dataset.change === "s-reason") S.staff.reason = x.value;
  if (x.dataset.input === "o-draft") S.owner.draft[x.dataset.k] = x.value;
});
document.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target, kind = f.dataset.form;
  if (kind === "join") {
    const g = S.guest;
    if (S.venue.pin && g.code !== S.codes[g.table]) { g.codeErr = true; render(); document.querySelector('[name="code"]')?.focus(); return; }
    g.codeErr = false; g.step = g.mine.length ? "track" : "menu";
    if (!S.visits[g.table]) S.visits[g.table] = { table: g.table, guests: 2, opened: now(), billAsked: false, paid: null };
  }
  if (kind === "invite") {
    const v = S.owner.invite.trim().toLowerCase();
    if (!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/.test(v)) { S.owner.inviteErr = true; render(); document.querySelector('[name="email"]')?.focus(); return; }
    S.owner.invites.push({ email: v }); S.owner.invite = ""; S.owner.inviteErr = false;
  }
  if (kind === "settings") {
    const fd = new FormData(f), v = S.venue;
    v.name = { en: fd.get("nen").trim() || v.name.en, ar: fd.get("nar").trim() || v.name.ar }; v.tagline = { en: fd.get("ten"), ar: fd.get("tar") }; v.service = fd.get("svc");
    S.owner.savedAt = now(); setTimeout(render, 2600);
  }
  render();
});
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (S.guest.sheet) S.guest.sheet = null; else if (S.guest.cartOpen) S.guest.cartOpen = false; else if (S.staff.cancel) S.staff.cancel = null; else if (S.owner.drawer) S.owner.drawer = null; else return;
  render();
});
// keep timers honest without stealing focus from inputs
setInterval(() => {
  document.querySelectorAll("[data-since]").forEach(e => { const late = e.closest(".tk.late"); e.textContent = since(+e.dataset.since) + (late ? ` · ${t("late")}` : ""); });
}, 15000);

S = { view: params.get("view") || (innerWidth > 1100 ? "split" : "guest"), lang: params.get("lang") || "en", theme: params.get("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") };
seed();
if (params.get("step")) S.guest.step = params.get("step");
if (params.get("page")) S.owner.page = params.get("page");
if (params.get("step") === "track") { S.guest.cart = [{ item: "lamb-machboos", qty: 1, opt: 0, note: "", price: 6800 }, { item: "coffee", qty: 1, opt: 0, note: "", price: 2200 }]; placeOrder(); S.orders.at(-1).at -= 2 * MIN; }
render();
})();
</script>
